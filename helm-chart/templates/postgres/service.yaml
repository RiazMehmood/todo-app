{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.postgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "todo-app.postgres.selectorLabels" . | nindent 4 }}
  clusterIP: None  # Headless service for StatefulSet
{{- end }}

