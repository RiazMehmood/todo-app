{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.secrets.username | quote }}
  password: {{ .Values.postgres.secrets.password | quote }}
{{- end }}

