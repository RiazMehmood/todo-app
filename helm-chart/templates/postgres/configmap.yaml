{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.postgres.labels" . | nindent 4 }}
data:
  database_name: {{ .Values.postgres.config.database_name | quote }}
{{- end }}

