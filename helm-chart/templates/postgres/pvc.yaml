{{- if and .Values.postgres.enabled (not .Values.postgres.persistence.enabled) }}
{{- /* 
  This PVC is for manual creation if not using StatefulSet volumeClaimTemplates.
  If postgres.persistence.enabled is true, the StatefulSet will create PVCs automatically.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.postgres.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgres.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | default "10Gi" }}
{{- end }}

