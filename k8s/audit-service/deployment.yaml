# Audit Service Deployment - Phase V
# Dapr consumer for task events + HTTP API for audit queries

apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: default
  labels:
    app: audit
    component: microservice
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
        component: microservice
        version: v1
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-service"
        dapr.io/app-port: "8001"
        dapr.io/app-protocol: "http"
        dapr.io/config: "no-mtls-config"
        dapr.io/log-level: "info"
    spec:
      containers:
      - name: audit
        image: audit-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        - containerPort: 50053
          name: grpc
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: databaseUrl
        - name: DAPR_APP_PORT
          value: "50053"
        - name: DAPR_PUBSUB_NAME
          value: "kafka-pubsub"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: audit
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  - name: grpc
    port: 50053
    targetPort: 50053
