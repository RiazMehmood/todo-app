apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: todo-app
  labels:
    app: todo-app
    component: backend
type: Opaque
stringData:
  # NOTE: Replace these values with actual secrets
  # Use: kubectl create secret generic backend-secrets --from-literal=database_url="..." --from-literal=better_auth_secret="..." --dry-run=client -o yaml
  database_url: "postgresql://user:password@host:5432/dbname"
  better_auth_secret: "your-secret-key-here-change-in-production"

