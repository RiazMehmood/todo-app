# Kubernetes Secrets Component - Centralized Secret Management
# Phase V - Secure Configuration
#
# This component allows Dapr to access Kubernetes secrets for:
# - Kafka credentials (username, password, bootstrap server)
# - Database connection strings
# - API keys (SendGrid, FCM, etc.)
# - JWT secrets
#
# All secrets are stored as Kubernetes secrets and accessed via Dapr Secret API.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
    # No additional metadata required for Kubernetes secret store
    # Dapr will use the service account token to access secrets in the same namespace

# Scopes - all services can access secrets
scopes:
  - backend-service
  - notification-service
  - audit-service
  - frontend-service
